<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collins Travel Agency - Explore The World</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; }
    header { background: #0a3d62; color: white; padding: 20px; text-align: center; }
    .packages { display: flex; gap: 20px; padding: 20px; justify-content: center; flex-wrap: wrap; }
    .card { border: 1px solid #ddd; border-radius: 10px; width: 300px; overflow:hidden; }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card div { padding: 15px; }
  </style>
</head>
<body>
  <header>
    <h1>Collins Travel Agency</h1>
    <p>Your trusted partner for flight bookings & tour packages</p>
  </header>
  
  <section class="packages">
    <figure class="card">
      <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34" alt="Paris">
      <figcaption><h3>Paris Getaway - $999</h3><p>5 Days in Paris with flight & hotel</p></figcaption>
    </figure>
    <figure class="card">
      <img src="https://images.unsplash.com/photo-1523906834658-6e24ef2386f9" alt="Dubai">
      <figcaption><h3>Dubai Luxury - $1,299</h3><p>Desert safari, Burj Khalifa & more</p></figcaption>
    </figure>
  </section>
</body>
</html>
